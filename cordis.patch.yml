# dsh-collab is one installable bundle. Its host row owns the gateway and its
# browser row owns the participant/host room surface; the room role is resolved
# from trusted session/token evidence at runtime.
- insert:
    - id: collab-host
      name: dsh-collab
      inject: [webServer, agents]
      config:
        enabled: true
        roomId: dsh-room
        hostId: local-host
        title: DSH Collaboration
        hostDisplayName: Local Host
