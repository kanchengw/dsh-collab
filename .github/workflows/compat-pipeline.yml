name: Compat Pipeline

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run watch + plan only; do not create a branch or PR"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: compat-pipeline
  cancel-in-progress: false

jobs:
  watch:
    name: Watch upstream
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      minor: ${{ steps.check.outputs.minor }}
      issue: ${{ steps.check.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure labels
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $labels = @(
            @{ name = "kind/upstream"; color = "1D76DB"; description = "Upstream DSH compatibility" },
            @{ name = "ready-for-agent"; color = "0E8A16"; description = "Ready for the compatibility agent" },
            @{ name = "plan-ready"; color = "0E8A16"; description = "Planner output is ready" },
            @{ name = "agent:review"; color = "FBCA04"; description = "Request compatibility review" },
            @{ name = "agent:blocked"; color = "B60205"; description = "Compatibility pipeline blocked" },
            @{ name = "awaiting-review"; color = "5319E7"; description = "Waiting for human review" },
            @{ name = "origin/internal"; color = "C5DEF5"; description = "Created by the repository workflow" }
          )
          foreach ($label in $labels) {
            gh label create $label.name --color $label.color --description $label.description --force 2>$null
          }

      - name: Check upstream
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          node scripts/compat/status.mjs --out compat-report.md
          node scripts/compat/status.mjs --json --out compat-report.json
          $report = Get-Content compat-report.json -Raw | ConvertFrom-Json
          $drift = [bool]$report.drift
          $tag = [string]$report.latest.tag
          $version = [string]$report.latest.version
          $minor = $version -replace '^(\d+\.\d+\.\d+).*','$1'
          $issueNumber = ""
          if ($drift) {
            $issues = gh issue list --repo $env:GITHUB_REPOSITORY --label kind/upstream --state open --json number,title | ConvertFrom-Json
            $existing = $issues | Where-Object { $_.title.StartsWith("[dsh $minor]") } | Select-Object -First 1
            $title = "[dsh $minor] Adapt to dsh-v$version"
            $header = @(
              "## Upstream",
              "",
              "- Tag: ``$tag``",
              "- Version: ``$version``",
              "- Commit: ``$($report.latest.commit)``",
              "- Released: ``$($report.latest.releasedAt)``",
              "- npm: ``next`` = ``$($report.npm.distTags.next)``",
              "",
              "## Compatibility report"
            ) -join "`n"
            $header | Set-Content issue-body.md -Encoding UTF8
            Add-Content issue-body.md (Get-Content compat-report.md -Raw) -Encoding UTF8
            if ($existing) {
              $issueNumber = [string]$existing.number
              gh issue edit $issueNumber --repo $env:GITHUB_REPOSITORY --title $title --body-file issue-body.md
              gh issue comment $issueNumber --repo $env:GITHUB_REPOSITORY --body "Upstream moved to ``$tag``. The compatibility report was updated in the issue body. Pipeline run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            } else {
              $url = gh issue create --repo $env:GITHUB_REPOSITORY --title $title --body-file issue-body.md --label kind/upstream --label ready-for-agent --label origin/internal
              $issueNumber = (($url | Select-Object -Last 1).Trim() -split '/')[-1]
            }
          }
          "drift=$($drift.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "minor=$minor" >> $env:GITHUB_OUTPUT
          "issue=$issueNumber" >> $env:GITHUB_OUTPUT

      - name: Audit watch
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $run = Join-Path $env:RUNNER_TEMP "compat-watch"
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item compat-report.md (Join-Path $run "compat-report.md")
          Copy-Item compat-report.json (Join-Path $run "compat-report.json")
          node scripts/compat/audit.mjs init --role watcher --issue "${{ steps.check.outputs.issue }}" --out $run --commit (git rev-parse HEAD) --input (Join-Path $run "compat-report.md") --input (Join-Path $run "compat-report.json")
          $status = if ("${{ steps.check.outputs.drift }}" -eq "true") { "drift" } else { "clean" }
          $summary = if ($status -eq "drift") { "Upstream drift detected: ${{ steps.check.outputs.tag }}" } else { "No upstream drift" }
          @{ role = "watcher"; status = $status; summary = $summary; tag = "${{ steps.check.outputs.tag }}"; version = "${{ steps.check.outputs.version }}"; issue = "${{ steps.check.outputs.issue }}" } | ConvertTo-Json | Set-Content (Join-Path $run "output.json") -Encoding UTF8
          node scripts/compat/audit.mjs finish --role watcher --dir $run --output (Join-Path $run "output.json")
          if ("${{ steps.check.outputs.issue }}" -ne "") {
            gh issue comment "${{ steps.check.outputs.issue }}" --repo $env:GITHUB_REPOSITORY --body-file (Join-Path $run "audit.md")
          }

      - name: Upload watch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/compat-watch
          if-no-files-found: warn

  loop:
    name: Compatibility loop
    needs: watch
    if: needs.watch.outputs.drift == 'true' && needs.watch.outputs.issue != ''
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare Codex home
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "codex-home"
          New-Item -ItemType Directory -Force $codexHome | Out-Null
          Copy-Item compat/codex/config.toml $codexHome
          Copy-Item compat/codex/model-catalog.json $codexHome
          "CODEX_HOME=$codexHome" | Out-File -Append $env:GITHUB_ENV
          "COMPAT_CODEX_VERSION=0.142.5" | Out-File -Append $env:GITHUB_ENV

      - name: Install Codex
        shell: pwsh
        run: npm install --global @openai/codex@0.142.5

      - name: Download watch artifact
        uses: actions/download-artifact@v4
        with:
          name: compat-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/watch-artifact

      - name: Run compatibility loop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ISSUE_NUMBER: ${{ needs.watch.outputs.issue }}
          TAG: ${{ needs.watch.outputs.tag }}
          VERSION: ${{ needs.watch.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run || 'false' }}
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/compat/pipeline-loop.ps1 -MaxAttempts 3
          if ($LASTEXITCODE -ne 0) { throw "compatibility loop exited with $LASTEXITCODE" }

      - name: Upload loop artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-loop-${{ github.run_id }}
          path: ${{ runner.temp }}/compat-loop
          if-no-files-found: warn
