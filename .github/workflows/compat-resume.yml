name: Compat Resume

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write

concurrency:
  group: compat-resume-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  resume:
    name: Resume compatibility loop
    if: >
      github.event.issue.state == 'open' &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/resume')
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare Codex home
        shell: pwsh
        run: |
          $codexHome = Join-Path $env:RUNNER_TEMP "codex-home"
          New-Item -ItemType Directory -Force $codexHome | Out-Null
          Copy-Item compat/codex/config.toml $codexHome
          Copy-Item compat/codex/model-catalog.json $codexHome
          "CODEX_HOME=$codexHome" | Out-File -Append $env:GITHUB_ENV
          "COMPAT_CODEX_VERSION=0.142.5" | Out-File -Append $env:GITHUB_ENV

      - name: Install Codex
        shell: pwsh
        run: npm install --global @openai/codex@0.142.5

      - name: Resolve resume context
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          $ErrorActionPreference = "Stop"
          $eventIssue = [string]$env:EVENT_ISSUE_NUMBER
          $isPr = $env:EVENT_IS_PR -eq "true"
          $human = ($env:COMMENT_BODY -replace '^\s*/resume\s*', '').Trim()
          if (-not $human) { $human = "Human requested resume without additional instructions." }
          $reviewOnly = $human -match '(?i)\breview-only\b'

          if ($isPr) {
            $prNumber = $eventIssue
            $pr = gh pr view $prNumber --repo $env:GITHUB_REPOSITORY --json body,labels | ConvertFrom-Json
            $match = [regex]::Match($pr.body, '(?i)(closes|fixes|resolves)\s+#(\d+)')
            if (-not $match.Success) { throw "PR body does not contain Closes #N" }
            $issueNumber = $match.Groups[2].Value
          } else {
            $issueNumber = $eventIssue
            $prs = gh pr list --repo $env:GITHUB_REPOSITORY --state open --json number,body | ConvertFrom-Json
            $pr = $prs | Where-Object { $_.body -match "(?i)(closes|fixes|resolves)\s+#$issueNumber\b" } | Select-Object -Last 1
            $prNumber = if ($pr) { [string]$pr.number } else { "" }
          }

          $issueInfo = gh issue view $issueNumber --repo $env:GITHUB_REPOSITORY --json labels,comments,body | ConvertFrom-Json
          if (-not ($issueInfo.labels | Where-Object { $_.name -eq "kind/upstream" })) {
            throw "issue #$issueNumber is not a compat issue"
          }

          $issueBlocked = [bool]($issueInfo.labels | Where-Object { $_.name -eq "agent:blocked" })
          $prBlocked = $false
          if ($prNumber) {
            $prLabels = gh pr view $prNumber --repo $env:GITHUB_REPOSITORY --json labels | ConvertFrom-Json
            $prBlocked = [bool]($prLabels.labels | Where-Object { $_.name -eq "agent:blocked" })
          }
          if (-not $reviewOnly -and -not ($issueBlocked -or $prBlocked)) {
            $message = "Compatibility resume ignored: this work item is not ``agent:blocked``."
            if ($isPr) { gh pr comment $eventIssue --repo $env:GITHUB_REPOSITORY --body $message }
            else { gh issue comment $eventIssue --repo $env:GITHUB_REPOSITORY --body $message }
            throw "resume requires agent:blocked"
          }
          if ($reviewOnly -and -not $prNumber) {
            $message = "Compatibility review-only ignored: an open PR is required."
            if ($isPr) { gh pr comment $eventIssue --repo $env:GITHUB_REPOSITORY --body $message }
            else { gh issue comment $eventIssue --repo $env:GITHUB_REPOSITORY --body $message }
            throw "review-only requires an open PR"
          }

          $comments = $issueInfo.comments
          $planRound = 1 + (($comments | Where-Object { $_.body -like "*<!-- compat:plan*" }).Count)
          $tagMatch = [regex]::Match([string]$issueInfo.body, '(?m)^-\s*Tag:\s*`([^`]+)`')
          $versionMatch = [regex]::Match([string]$issueInfo.body, '(?m)^-\s*Version:\s*`([^`]+)`')
          if (-not $tagMatch.Success -or -not $versionMatch.Success) { throw "issue #$issueNumber does not record Tag/Version" }
          $tag = $tagMatch.Groups[1].Value
          $version = $versionMatch.Groups[1].Value

          $humanFile = Join-Path $env:RUNNER_TEMP "human-input.txt"
          $human | Set-Content $humanFile -Encoding UTF8
          $watch = Join-Path $env:RUNNER_TEMP "watch-artifact"
          New-Item -ItemType Directory -Force $watch | Out-Null
          node scripts/compat/status.mjs --out (Join-Path $watch "compat-report.md")

          "ISSUE_NUMBER=$issueNumber" | Out-File -Append $env:GITHUB_ENV
          "PR_NUMBER=$prNumber" | Out-File -Append $env:GITHUB_ENV
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
          "PLAN_ROUND=$planRound" | Out-File -Append $env:GITHUB_ENV
          "HUMAN_INPUT_FILE=$humanFile" | Out-File -Append $env:GITHUB_ENV
          "REVIEW_ONLY=$($reviewOnly.ToString().ToLower())" | Out-File -Append $env:GITHUB_ENV


      - name: Run compatibility loop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          RESUME: "true"
          DRY_RUN: "false"
        run: |
          $ErrorActionPreference = "Stop"
          & pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/compat/pipeline-loop.ps1 -MaxAttempts 3
          if ($LASTEXITCODE -ne 0) { throw "compatibility resume loop exited with $LASTEXITCODE" }

      - name: Upload loop artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/compat-loop
          if-no-files-found: warn
