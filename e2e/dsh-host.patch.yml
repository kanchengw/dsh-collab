# Host DSH runtime overlay used by the real two-profile browser acceptance run.
- id: collab-host
  config:
    enabled: true
    roomId: dsh-room
    hostId: host
    allowLoopbackPrincipal: true
    host: 127.0.0.1
    port: 4312
    title: DSH Collaboration
    hostDisplayName: Host DSH
- id: directory-picker
  disabled: true
- insert:
  - id: directory-picker-browse
    name: '@deepseek-ai/dsh-host-directory-picker-browse'
  - id: ui-directory-picker-browse
    name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
