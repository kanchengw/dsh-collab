worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

events {
    worker_connections 128;
}

http {
    client_body_temp_path temp/client_body;
    proxy_temp_path temp/proxy;
    fastcgi_temp_path temp/fastcgi;
    uwsgi_temp_path temp/uwsgi;
    scgi_temp_path temp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_origin $host_collab_cors_origin {
        default "";
        "http://127.0.0.1:3082" $http_origin;
    }

    map $http_origin $participant_collab_cors_origin {
        default "";
        "http://127.0.0.1:3083" $http_origin;
    }

    upstream dsh_host {
        server 127.0.0.1:3082;
    }

    upstream dsh_participant {
        server 127.0.0.1:3083;
    }

    # Host DSH browser entry point.
    server {
        listen 3182;
        server_name 127.0.0.1;

        location ^~ /collab/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $host_collab_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary Origin always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_bind 127.0.0.2;
            proxy_pass http://dsh_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_set_header X-DSH-Principal-Id "";
            proxy_set_header X-Authenticated-User "host";
            proxy_set_header X-DSH-Proxy "1";
            add_header Access-Control-Allow-Origin $host_collab_cors_origin always;
            add_header Vary Origin always;
        }

        location / {
            proxy_pass http://dsh_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # Participant DSH browser entry point. Its collab calls go to the Host DSH.
    server {
        listen 3183;
        server_name 127.0.0.1;

        location ^~ /collab/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $participant_collab_cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary Origin always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_bind 127.0.0.2;
            proxy_pass http://dsh_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 1h;
            proxy_buffering off;
            proxy_set_header X-DSH-Principal-Id "";
            proxy_set_header X-Authenticated-User "participant";
            proxy_set_header X-DSH-Proxy "1";
            add_header Access-Control-Allow-Origin $participant_collab_cors_origin always;
            add_header Vary Origin always;
        }

        location / {
            proxy_pass http://dsh_participant;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
